<!DOCTYPE html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Resume & LinkedIn</title></head>
<body style="font-family:Poppins,system-ui;background:#f5f9ff;padding:2rem;text-align:center">
  <h2>Resume & LinkedIn Optimizer</h2>
  <textarea id="info" placeholder="Paste your experience, skills, job titles, achievements (short paragraph)" style="width:90%;height:140px;padding:10px;border-radius:8px"></textarea><br>
  <input id="target" placeholder="Target role (optional)" style="width:90%;padding:10px;border-radius:8px"/><br>
  <button id="go">Optimize</button>
  <div id="out" style="white-space:pre-wrap;background:#fff;padding:1rem;border-radius:8px;max-width:900px;margin:1rem auto"></div>

<script>
document.getElementById("go").onclick = async () => {
  const info = document.getElementById("info").value.trim();
  const target = document.getElementById("target").value.trim();
  if(!info){ alert("Enter your info"); return; }
  document.getElementById("out").textContent = "⏳ Generating...";
  try {
    const res = await fetch("https://YOUR-RENDER-URL/generate/resume", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ info, target_role: target })
    });
    const data = await res.json();
    document.getElementById("out").textContent = data.resume || data.error || "No output";
  } catch(e) {
    document.getElementById("out").textContent = "Error: "+e.message;
  }
};
</script>
</body></html>
