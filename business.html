<!DOCTYPE html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Business Ideas</title></head>
<body style="font-family:Poppins,system-ui;background:#f5f9ff;padding:2rem;text-align:center">
  <h2>Business / Side-hustle Ideas</h2>
  <input id="niche" placeholder="Niche or topic (e.g. 'pet care', 'remote work tools')" style="width:90%;padding:10px;border-radius:8px"/><br>
  <button id="go">Generate Ideas</button>
  <div id="out" style="white-space:pre-wrap;background:#fff;padding:1rem;border-radius:8px;max-width:900px;margin:1rem auto"></div>

<script>
document.getElementById("go").onclick = async () => {
  const niche = document.getElementById("niche").value.trim();
  if(!niche){ alert("Enter niche"); return; }
  document.getElementById("out").textContent = "⏳ Generating...";
  try {
    const res = await fetch("https://YOUR-RENDER-URL/generate/business", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ niche })
    });
    const data = await res.json();
    document.getElementById("out").textContent = data.ideas || data.error || "No output";
  } catch(e) {
    document.getElementById("out").textContent = "Error: "+e.message;
  }
};
</script>
</body></html>
