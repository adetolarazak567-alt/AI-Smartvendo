<!DOCTYPE html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Freelance Proposal</title></head>
<body style="font-family:Poppins,system-ui;background:#f5f9ff;padding:2rem;text-align:center">
  <h2>Freelance Proposal / Gig Writer</h2>
  <input id="gig" placeholder="Service / Gig title" style="width:90%;padding:10px;border-radius:8px"/><br>
  <textarea id="brief" placeholder="Short client brief or your approach (optional)" style="width:90%;height:120px;padding:10px;border-radius:8px"></textarea><br>
  <button id="go">Generate Proposal</button>
  <div id="out" style="white-space:pre-wrap;background:#fff;padding:1rem;border-radius:8px;max-width:900px;margin:1rem auto"></div>

<script>
document.getElementById("go").onclick = async () => {
  const gig = document.getElementById("gig").value.trim();
  const brief = document.getElementById("brief").value.trim();
  if(!gig){ alert("Enter gig"); return; }
  document.getElementById("out").textContent = "⏳ Generating...";
  try {
    const res = await fetch("https://YOUR-RENDER-URL/generate/freelance", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ gig, brief })
    });
    const data = await res.json();
    document.getElementById("out").textContent = data.proposal || data.error || "No output";
  } catch(e) {
    document.getElementById("out").textContent = "Error: "+e.message;
  }
};
</script>
</body></html>
