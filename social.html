<!DOCTYPE html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Social Growth</title></head>
<body style="font-family:Poppins,system-ui;background:#f5f9ff;padding:2rem;text-align:center">
  <h2>Social Media Growth Kit</h2>
  <input id="topic" placeholder="Topic or niche (e.g. 'fitness tips')" style="width:90%;padding:10px;border-radius:8px"/><br>
  <select id="platform"><option>instagram</option><option>twitter</option><option>tiktok</option></select><br>
  <button id="go">Generate Kit</button>
  <div id="out" style="white-space:pre-wrap;background:#fff;padding:1rem;border-radius:8px;max-width:900px;margin:1rem auto"></div>

<script>
document.getElementById("go").onclick = async () => {
  const topic = document.getElementById("topic").value.trim();
  const platform = document.getElementById("platform").value;
  if(!topic){ alert("Enter topic"); return; }
  document.getElementById("out").textContent = "⏳ Generating...";
  try {
    const res = await fetch("https://YOUR-RENDER-URL/generate/social", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ topic, platform })
    });
    const data = await res.json();
    document.getElementById("out").textContent = data.social || data.error || "No output";
  } catch(e) {
    document.getElementById("out").textContent = "Error: "+e.message;
  }
};
</script>
</body></html>
