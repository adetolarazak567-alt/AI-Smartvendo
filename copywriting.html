<!DOCTYPE html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Copywriting</title></head>
<body style="font-family:Poppins,system-ui;background:#f5f9ff;padding:2rem;text-align:center">
  <h2>AI Copywriting</h2>
  <input id="product" placeholder="Product name or short description" style="width:90%;padding:10px;border-radius:8px"/><br>
  <select id="length"><option value="short">Short</option><option value="medium">Medium</option><option value="long">Long</option></select>
  <select id="tone"><option>persuasive and professional</option><option>friendly</option><option>fun/energetic</option></select><br>
  <button id="go">Generate Copy</button>
  <div id="out" style="margin-top:1rem;white-space:pre-wrap;background:#fff;padding:1rem;border-radius:8px;max-width:900px;margin-left:auto;margin-right:auto"></div>

<script>
document.getElementById("go").onclick = async () => {
  const product = document.getElementById("product").value.trim();
  if(!product){ alert("Enter product"); return; }
  document.getElementById("out").textContent = "⏳ Generating...";
  try {
    const res = await fetch("https://YOUR-RENDER-URL/generate/copywriting", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ product, tone: document.getElementById("tone").value, length: document.getElementById("length").value })
    });
    const data = await res.json();
    document.getElementById("out").textContent = data.copy || data.error || "No output";
  } catch(e) {
    document.getElementById("out").textContent = "Error: "+e.message;
  }
};
</script>
</body></html>
